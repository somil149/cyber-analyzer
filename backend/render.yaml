services:
  - type: web
    name: cyber-analyzer-backend
    env: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
    autoDeploy: false