name = "cyber-analyzer-api-gateway"
main = "index.js"
compatibility_date = "2024-01-01"

# Environment variables
[vars]
ENVIRONMENT = "production"
BACKEND_URL = "https://your-backend-url.railway.app" # Replace with your Railway/Render URL

# KV namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-namespace-id" # Replace with your KV namespace ID

# Routes
[[routes]]
pattern = "api.cyber-analyzer.pages.dev/*"
zone_name = "pages.dev"